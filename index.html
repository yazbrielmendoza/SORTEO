<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 SORTEO EN VIVO</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-active: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            position: relative;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .grid-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
        }

        .num-btn {
            background-color: #334155;
            color: var(--text-main);
            border: 2px solid transparent;
            border-radius: 8px;
            height: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .num-btn:hover {
            background-color: #475569;
        }

        .num-btn.marcado {
            background-color: var(--primary-active);
            color: white;
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: auto;
            padding: 10px;
        }

        .btn-reset {
            background-color: #b91c1c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        .btn-reset:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎰 SORTEO EN VIVO</h1>
            <p>Marca los números ganadores en tiempo real</p>
            <div class="live-badge">
                <span class="dot"></span> En Vivo
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-label">Participantes en línea</div>
                <div class="stat-value" id="online-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Números Marcados</div>
                <div class="stat-value"><span id="marked-count">0</span> / 90</div>
            </div>
        </div>

        <div class="grid-container" id="grid">
            <!-- Los 90 botones se generarán con JS -->
        </div>

        <div style="text-align: center;">
            <button class="btn-reset" onclick="reiniciarSorteo()">Limpiar Tablero</button>
        </div>

        <footer>
            <p>✨ Haz clic en los números para marcarlos - ¡Los demás verán tu selección en tiempo real!</p>
        </footer>
    </div>

    <!-- SDKs de Firebase (compatibilidad para HTML/JS simple) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // 1. Configuración de Firebase
        const firebaseConfig = {
            databaseURL: "https://fire-f90b1-default-rtdb.firebaseio.com/"
        };

        // 2. Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const sorteoRef = database.ref('sorteo');
        const presenciaRef = database.ref('presencia');

        // 3. Generar la cuadrícula de 1 a 90 en el HTML
        const grid = document.getElementById('grid');
        for (let i = 1; i <= 90; i++) {
            const btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.id = `num-${i}`;
            btn.textContent = i;
            btn.onclick = () => toggleNumero(i);
            grid.appendChild(btn);
        }

        // 4. Cambiar estado de un número (Marcar / Desmarcar)
        function toggleNumero(numero) {
            const numRef = sorteoRef.child(`numeros/${numero}`);
            numRef.once('value', snapshot => {
                if (snapshot.exists()) {
                    numRef.remove(); // Desmarcar
                } else {
                    numRef.set(true); // Marcar
                }
            });
        }

        // 5. Escuchar cambios de números en Firebase en tiempo real
        sorteoRef.child('numeros').on('value', snapshot => {
            const marcados = snapshot.val() || {};
            let contadorMarcados = 0;

            for (let i = 1; i <= 90; i++) {
                const btn = document.getElementById(`num-${i}`);
                if (marcados[i]) {
                    btn.classList.add('marcado');
                    contadorMarcados++;
                } else {
                    btn.classList.remove('marcado');
                }
            }

            document.getElementById('marked-count').textContent = contadorMarcados;
        });

        // 6. Sistema de usuarios conectados en vivo (Presencia)
        const connectedRef = database.ref('.info/connected');
        connectedRef.on('value', snap => {
            if (snap.val() === true) {
                const con = presenciaRef.push();
                con.onDisconnect().remove(); // Se borra al cerrar/desconectarse
                con.set(true);
            }
        });

        presenciaRef.on('value', snap => {
            const count = snap.numChildren();
            document.getElementById('online-count').textContent = count;
        });

        // 7. Función para reiniciar todo el tablero
        function reiniciarSorteo() {
            if (confirm("¿Estás seguro de que deseas limpiar todo el tablero para todos los usuarios?")) {
                sorteoRef.child('numeros').remove();
            }
        }
    </script>
</body>
</html>
