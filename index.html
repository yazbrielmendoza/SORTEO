<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo - Marcador de Números</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🎰 SORTEO</h1>
            <p class="subtitle">Marca los números ganadores</p>
        </header>

        <!-- Controls -->
        <div class="controls">
            <button id="resetBtn" class="btn btn-danger">Reiniciar</button>
            <button id="exportBtn" class="btn btn-success">Descargar</button>
            <div class="counter">
                <span class="marked-count">0</span> / <span class="total-count">90</span>
            </div>
        </div>

        <!-- Grid de números -->
        <div class="numbers-grid" id="numbersGrid">
            <!-- Los números se generarán con JavaScript -->
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Haz clic en los números para marcarlos como ganadores</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
